[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qe-engineering-skill"
version = "0.3.0"
description = "Deterministic evidence and trust contracts for manual quality engineering"
requires-python = ">=3.12"
dependencies = ["pydantic==2.10.6", "jsonschema==4.23.0", "PyYAML==6.0.3"]

[project.scripts]
qe = "qe_skill.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.11.0", "mypy==1.15.0", "types-jsonschema==4.23.0.20241208", "types-PyYAML==6.0.12.20260906"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qe_skill = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
